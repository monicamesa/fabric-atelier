id: agent-jury
name: agent-jury
version: 1.0.0
services:
  auth:
    enabled: true
    fabric:
      enabled: true
      externalEntraExchange: true
    allowedRedirectUris:
      - http://localhost:5173
      - http://127.0.0.1:5173
  data:
    enabled: true
    dialect: mssql
  storage:
    enabled: false
  staticHosting:
    enabled: true
    folder: dist
    buildCommand: npm run build:fabric
    indexDocument: index.html
    assetAccess: protected
  functions:
    enabled: true
    buildCommand: npm run build
    auth:
      type: application
secrets:
  - name: APP_SQL_SERVER
    description: Server FQDN of the app SQL database (admin Function T-SQL)
  - name: APP_SQL_DATABASE
    description: Database name of the app SQL database (admin Function T-SQL)
  - name: LEGACY_CHECK_CUTOFF_UTC
    description: Optional. Admin log rows before this ISO UTC time count as automated checks. Leave unset.
  - name: HEARING_WORKSPACE_ID
    description: Workspace that holds the evaluate_agent notebook (hearing actions). Unset on deployments without hearings.
  - name: HEARING_NOTEBOOK_ID
    description: Item of the evaluate_agent notebook (hearing actions). Unset on deployments without hearings.
