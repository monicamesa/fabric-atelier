id: moss-triage
name: Moss Triage
version: 1.0.0
secrets:
  - name: RIC_DATA_AGENT_MCP_URL
    description: Endpoint MCP publicado del agente Ric.
services:
  functions:
    enabled: true
    path: packages/functions
    buildCommand: npm run build
    auth:
      type: application
  auth:
    enabled: true
    fabric:
      enabled: true
      externalEntraExchange: true
    password:
      enabled: false
    allowedRedirectUris:
      - http://localhost:5173
      - http://localhost:5174
      - http://127.0.0.1:5174
      - ${MOSS_TRIAGE_APP_URL:-http://localhost:5173}
  data:
    enabled: true
    path: packages/data
    buildCommand: npm run build
    dialect: mssql
  staticHosting:
    enabled: true
    path: packages/frontend
    folder: dist
    buildCommand: npm run build:fabric
    indexDocument: index.html
    assetAccess: protected
    embedded:
      only: false
  storage:
    enabled: false
connectors:
  - name: ricsupport
    type: fabric-sqlanalytics
    config:
      workspaceId: ${RIC_SUPPORT_WORKSPACE_ID}
      itemId: ${RIC_SUPPORT_ITEM_ID}
    auth:
      type: application
    operations:
      - name: read
